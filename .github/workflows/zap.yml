name: ZAP (analyse passive du site en ligne)

# Analyse dynamique du site publie, en mode passif uniquement (ZAP baseline) : le robot suit les liens et
# observe les reponses, sans attaque active. Le site n'a aucun <form> et le robot n'execute pas de
# JavaScript : rien ne peut partir vers la base. Rapport en artefact, aucun ticket cree automatiquement.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zap:
    name: ZAP baseline (passif)
    runs-on: ubuntu-latest
    # aucun droit sur le depot : ZAP n'en a pas besoin, et pas de checkout (l'action monte le dossier de
    # travail en ecriture dans son conteneur). Le rapport-zap d'un depot public est telechargeable par tous.
    permissions: {}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://jtthre.github.io/phishdojo/
          # image ZAP stable figee par empreinte
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
          allow_issue_writing: false
          fail_action: false
          artifact_name: rapport-zap
