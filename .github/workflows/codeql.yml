name: CodeQL

# Analyse statique du JavaScript et des workflows eux-memes (injections dans les actions).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions: {}

jobs:
  analyse:
    name: Analyse ${{ matrix.langage }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        langage: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.langage }}
          queries: security-extended
          # premier jeu archive (jamais publie, repris en phase C) et cas de test volontairement vulnerables des regles Semgrep
          config: |
            paths-ignore:
              - archives
              - semgrep/tests
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.langage }}
