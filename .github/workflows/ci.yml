name: CI/CD

# Securite de la chaine : actions epinglees par empreinte de commit (tag en commentaire, mises a
# jour par Dependabot), permissions minimales par job, jeton GitHub non conserve apres checkout,
# installation npm depuis le fichier de verrouillage sans scripts d'installation tiers.
# Le deploiement fait partie du meme workflow : il ne part que d'un push sur main du depot,
# une fois tous les controles verts (pas de declencheur workflow_run, dangereux avec les forks).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # on annule les anciennes executions d'une pull request, jamais un deploiement en cours sur main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  masquage:
    name: Test de fuite et regles de securite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      # les modeles sont des pickles : un fichier remplace sans mise a jour des empreintes bloque la CI
      - name: Empreintes des modeles entraines
        working-directory: ml/models
        run: sha256sum --check --strict SHA256SUMS

  base:
    name: Schema SQL sur Postgres
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # figee par empreinte, a monter a la main
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Migrations puis tests (dont tests d'attaque sur les droits)
        run: bash scripts/test-sql.sh

  page:
    name: Parcours et securite dans le navigateur
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Dependances (verrouillees, sans scripts d'installation)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run vendre
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  dependances:
    name: Vulnerabilites des dependances
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Audit npm (bloquant a partir de « high »)
        run: npm audit --audit-level=high
      - name: Revue des dependances ajoutees par la pull request
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  workflows:
    name: Audit de securite des workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (injections, declencheurs dangereux, permissions, epinglage)
        run: |
          pip install --quiet --require-hashes --no-deps -r .github/zizmor/requirements.txt
          zizmor --offline --min-severity low .github/workflows

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    name: Deploiement - migrations Supabase
    needs: [masquage, base, page, dependances, workflows, secrets]
    # Saute tant que Supabase n'est pas configure (aucune approbation demandee pour rien).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    # Environnement protege : chaque migration de production attend l'approbation du proprietaire.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # version figee, comme les actions ; Dependabot ne la suit pas : a monter a la main
          version: 2.120.0
      # Aucun jeton d'API Supabase (il pouvait lire les cles secretes du projet, et il expire) :
      # connexion directe au pooler de session, en IPv4 (les machines GitHub n'ont pas d'IPv6).
      # Secret de l'environnement production, lisible seulement apres approbation (docs/INSTALLER.md).
      - name: Appliquer les migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::secret SUPABASE_DB_URL absent de l'environnement production (docs/INSTALLER.md, etape 6)"
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL"

  site:
    name: Deploiement - site sur GitHub Pages
    needs: [masquage, base, page, dependances, workflows, secrets, migrations]
    # Tous les controles verts ; migrations reussies ou sautees (base pas encore configuree).
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Polices et OCR servis par le site (verrouilles, sans scripts tiers)
        run: |
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund
          npm run vendre
      - name: Configuration publique et CSP restreinte a la base
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          MODE_TEST: ${{ vars.MODE_TEST }}
        run: node scripts/ecrire-config.js
      # empreinte de contenu sur style.css, scripts et logo : jamais de page neuve avec une ressource en cache
      - name: Empreintes des ressources (cache des navigateurs)
        run: node scripts/versionner.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
