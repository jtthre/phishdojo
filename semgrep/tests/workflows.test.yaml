# Cas de test des règles semgrep/regles/workflows.yml (semgrep --test). Workflow fictif, jamais exécuté.
name: exemple
on:
  push:
  # ruleid: pds-declencheur-dangereux
  pull_request_target:
  # ruleid: pds-declencheur-dangereux
  workflow_run:
    workflows: [CI]
# ok: pds-donnee-evenement-interpolee
concurrency: ci-${{ github.ref }}-${{ github.event_name }}
jobs:
  essai:
    runs-on: ubuntu-latest
    container:
      # ruleid: pds-action-non-figee
      image: postgres:17
    services:
      base:
        # ok: pds-action-non-figee
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    env:
      # ruleid: pds-donnee-evenement-interpolee
      TITRE: ${{ github.event.pull_request.title }}
    steps:
      # ok: pds-action-non-figee
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ruleid: pds-action-non-figee
      - uses: actions/setup-node@v7
      # ruleid: pds-action-non-figee
      - uses: exemple/action@main
      # ruleid: pds-action-non-figee
      - uses: docker://alpine:3.20
      # ok: pds-action-non-figee
      - uses: docker://alpine@sha256:0a4eaa0eecf5f8c050e5bba433f58c052be7587ee8af3e8b3910ef9ab5fbe9f5
      # ok: pds-action-non-figee
      - uses: ./.github/actions/locale
      # ruleid: pds-donnee-evenement-interpolee
      - run: echo "${{ github.event.pull_request.title }}"
      # ruleid: pds-donnee-evenement-interpolee
      - run: git switch ${{ github.head_ref }}
      # ruleid: pds-donnee-evenement-interpolee
      - run: echo "${{ github.ref_name }}"
      # ruleid: pds-donnee-evenement-interpolee
      - run: echo '${{ toJSON(github.event) }}'
      # ruleid: pds-donnee-evenement-interpolee
      - run: echo "${{ inputs.cible }}"
      # ok: pds-donnee-evenement-interpolee
      - if: github.event_name == 'push'
        run: echo "pas de donnee d'evenement interpolee"
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          # ruleid: pds-action-non-figee
          docker_name: ghcr.io/zaproxy/zaproxy:stable
