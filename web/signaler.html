<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Signalez un SMS, un message WhatsApp ou un appel d'arnaque au Sénégal. Le message est masqué sur votre téléphone avant l'envoi.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<title>Signaler une arnaque · PhishDojo</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="signaler" data-titre="title">
<div class="app">
  <p class="banner" id="test-banner" role="status" hidden data-t="testBanner"></p>
  <header class="top">
    <a class="mark" href="index.html">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path class="logo-encre" d="M5 17V5h12M31 5h12v12M43 31v12H31M17 43H5V31" stroke-width="4" stroke-linecap="square"/><circle class="logo-point" cx="24" cy="24" r="6.5"/></svg>
      <span class="wordmark">Phish<span class="dojo">Dojo</span></span>
    </a>
    <div class="tools">
      <button type="button" class="icon-btn" id="theme" aria-pressed="false"></button>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>

  <main id="form-view" class="app">
    <section class="hero">
      <h1 data-t="title">Signaler une arnaque</h1>
      <p data-t="lead"></p>
      <div class="seal"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z" fill="currentColor"/></svg><span data-t="seal"></span></div>
    </section>

    <section class="card" aria-labelledby="h-s1">
      <h2 id="h-s1" data-t="s1"></h2>
      <div>
        <label for="msg" data-t="msgLabel"></label>
        <textarea id="msg" maxlength="4000" data-tph="msgPh" spellcheck="false"></textarea>
      </div>
      <div>
        <input type="file" id="shot" accept="image/*" hidden>
        <button type="button" class="file-btn" id="shot-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v13H4z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span data-t="ocrBtn"></span>
        </button>
        <p class="status" id="ocr-status" role="status"></p>
      </div>
      <fieldset class="plain">
        <legend class="label" data-t="canal"></legend>
        <div class="chips" id="canaux"></div>
      </fieldset>
      <div class="grid">
        <div><label for="marque" data-t="marque"></label><select id="marque"></select></div>
        <div><label for="langue" data-t="langue"></label><select id="langue"></select></div>
        <div><label for="recu" data-t="recu"></label><input type="date" id="recu"></div>
        <div><label for="mode" data-t="mode"></label><select id="mode"></select></div>
      </div>
      <div>
        <label for="exp" data-t="exp"></label>
        <input type="tel" id="exp" inputmode="tel" autocomplete="off" maxlength="30">
        <p class="hint" data-t="expHint"></p>
      </div>
    </section>

    <section class="card" aria-labelledby="h-s2">
      <h2 id="h-s2" data-t="s2"></h2>
      <p class="lead" data-t="s2lead"></p>
      <div class="preview empty" id="preview" aria-live="polite"></div>
      <div class="row">
        <button type="button" class="btn" id="mask-sel" data-t="maskSel"></button>
        <button type="button" class="btn" id="undo" data-t="undo" disabled></button>
      </div>
      <p class="domains" id="domains" hidden></p>
    </section>

    <section class="card" aria-labelledby="h-s3">
      <h2 id="h-s3" data-t="s3"></h2>
      <label class="check"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
      <label class="check"><input type="checkbox" id="adult"><span data-t="adult"></span></label>
      <div class="hp" aria-hidden="true"><label>Site web <input type="text" id="site" tabindex="-1" autocomplete="off"></label></div>
      <p class="error" id="err" role="alert" hidden></p>
      <div><button type="button" class="btn primary" id="send" data-t="send"></button></div>
    </section>
  </main>

  <section class="card done" id="done-view" hidden aria-live="polite">
    <h2 data-t="thanks"></h2>
    <p class="note" id="demo-note" hidden data-t="demo"></p>
    <pre class="json" id="demo-json" hidden></pre>
    <div>
      <p class="label" data-t="idLabel"></p>
      <div class="id" id="report-id"></div>
      <p class="hint" data-t="idHint"></p>
    </div>
    <div class="row">
      <button type="button" class="btn" id="copy" data-t="copy"></button>
      <button type="button" class="btn primary" id="again" data-t="another"></button>
    </div>
  </section>

  <section class="card" aria-labelledby="h-priv">
    <details>
      <summary id="h-priv" data-t="privacyTitle"></summary>
      <ul id="privacy"></ul>
      <div class="del">
        <div><label for="del-id" data-t="delLabel"></label><input type="text" id="del-id" autocomplete="off" spellcheck="false"></div>
        <button type="button" class="btn" id="del" data-t="delBtn"></button>
      </div>
      <p class="status" id="del-status" role="status"></p>
    </details>
  </section>

  <footer data-t="footer"></footer>
</div>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="commun.js"></script>
<script src="masquage.js"></script>
<script src="signaler.js"></script>
</body>
</html>
