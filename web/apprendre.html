<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Douze situations d'arnaque vécues au Sénégal : choisissez le bon réflexe. En français et en wolof.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%231B2550%22/%3E%3Cpath d=%22M9 17c3-6 11-7 15-2-3 1-5 3-6 6-3-1-6-2-9-4z%22 fill=%22%23E3B12F%22/%3E%3C/svg%3E">
<title>S'entraîner · PhishDojo Sénégal</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="apprendre" data-titre="apTitle">
<div class="app">
  <p class="banner" id="test-banner" role="status" hidden data-t="testBanner"></p>
  <header class="top">
    <a class="mark" href="index.html">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="logo-fond" cx="16" cy="16" r="14"/><path class="logo-trait" d="M9 17c3-6 11-7 15-2-3 1-5 3-6 6-3-1-6-2-9-4z"/></svg>
      <span data-t="brand">PhishDojo Sénégal</span>
    </a>
    <div class="tools">
      <div class="lang" role="group" aria-label="Langue / Làkk">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="wo" aria-pressed="false">Wolof</button>
      </div>
      <button type="button" class="icon-btn" id="theme" aria-pressed="false"></button>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>

  <main class="app">
    <section class="hero">
      <h1 data-t="apTitle"></h1>
      <p data-t="apLead"></p>
    </section>

    <section class="card" id="intro">
      <div><button type="button" class="btn primary" id="start" data-t="apStart"></button></div>
    </section>

    <section class="card" id="jeu" hidden aria-live="polite">
      <div class="progress"><span id="prog-txt"></span><div class="bar" aria-hidden="true"><span id="prog-bar"></span></div></div>
      <p class="scene" id="scene"></p>
      <div class="choices" id="choices"></div>
      <div class="verdict" id="verdict" hidden>
        <strong id="v-titre"></strong>
        <span id="v-why"></span>
        <span class="method" id="v-methode"></span>
      </div>
      <div><button type="button" class="btn primary" id="next" hidden></button></div>
    </section>

    <section class="card" id="fin" hidden aria-live="polite">
      <h2 data-t="apScoreTitle"></h2>
      <p class="score" id="score"></p>
      <p id="grade"></p>
      <div class="row">
        <button type="button" class="btn" id="restart" data-t="apRestart"></button>
        <a class="btn primary" href="index.html" data-t="apReport"></a>
      </div>
    </section>
  </main>

  <footer data-t="footer"></footer>
</div>
<script src="i18n.js"></script>
<script src="commun.js"></script>
<script src="situations.js"></script>
<script src="apprendre.js"></script>
</body>
</html>
